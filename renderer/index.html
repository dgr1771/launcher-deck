<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>应用牌堆</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<div id="panel">
  <header id="titlebar">
    <h1><span class="suit">🃏</span>应用牌堆<span class="mode-tag" id="modeTag">· 塔罗牌阵</span></h1>
    <div class="sub" id="subtitle">正在召集本机程序…</div>
    <div class="hint" id="hint">Ctrl+J 收起 · 悬停看牌面 · 点击启动</div>
  </header>

  <div class="toolbar">
    <button class="tbtn" id="btnMode" title="切换启动 / 游戏"></button>
    <button class="tbtn gold" id="btnFortune" title="每日一抽：今天适合开哪个应用"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></svg><span>今日一抽</span></button>
    <span class="tb-sep"></span>
    <button class="tbtn icon-only" id="btnSearch" title="兜底搜索：不想翻的时候（支持拼音首字母）"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <div class="searchbox" id="searchbox">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="兜底搜索（可不用）…">
    </div>
    <div class="gamebtns" id="gameBtns" style="display:none">
      <button class="tbtn" id="btnUndo" title="悔一步棋（Ctrl+Z）"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>悔棋</span></button>
      <button class="tbtn" id="btnNewGame" title="重新发一局"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg><span>新局</span></button>
      <span class="movecount" id="moveCount">0 步</span>
    </div>
    <span class="tb-sep"></span>
    <button class="tbtn icon-only" id="btnTheme" title="外观主题：玻璃/呢绒/自定义配色"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 .5 18h1.2a2 2 0 0 0 .3-4H12.5a1.5 1.5 0 0 1 0-3H18a3.5 3.5 0 0 0 3.5-3.5C21.5 6.4 17.2 3 12 3z"/><path d="M7.5 10.5h.01M12 7.5h.01M16.5 10.5h.01"/></svg></button>
    <button class="tbtn icon-only" id="btnHotkey" title="修改全局快捷键"><svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10.2 10h.01M13.9 10h.01M17.6 10h.01M8 14h8"/></svg></button>
    <button class="tbtn icon-only" id="btnSound" title="音效开关"><svg class="ic" viewBox="0 0 24 24"><path d="M11.5 5.5L7 9H4v6h3l4.5 3.5v-13z"/><path d="M15 9a4.2 4.2 0 0 1 0 6M17.8 6.5a8 8 0 0 1 0 11"/></svg></button>
    <span class="tb-sep"></span>
    <button class="tbtn icon-only" id="btnClose" title="收起（Ctrl+J）"><svg class="ic" viewBox="0 0 24 24"><path d="M17 7L7 17M7 7l10 10"/></svg></button>
  </div>

  <!-- 塔罗牌阵（启动模式） -->
  <div id="tarot">
    <div class="chips" id="chips"></div>
    <div id="topRow"></div>
    <div id="grid"></div>
    <div id="searchResult"></div>
  </div>

  <!-- FreeCell 牌桌（游戏模式） -->
  <div id="fcboard">
    <div class="slots" id="slotCells"></div>
    <div class="slots slots--right" id="slotFound"></div>
    <div id="columns"></div>
  </div>
</div>

<div id="fortunePop"><div class="fcard-box" id="fortuneBox"></div></div>
<div id="winPop"><div class="fcard-box" id="winBox"></div></div>
<div id="toast"></div>

<script src="vendor/pinyin-pro.min.js"></script>
<script src="deck.js"></script>
</body>
</html>
